<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f4" />
    <title>MindCanvas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <canvas id="canvas" aria-label="MindCanvas infinite drawing canvas"></canvas>

      <header class="topbar">
        <button class="wordmark" id="homeButton" title="Reset view">MindCanvas</button>
        <div class="topbar-actions">
          <button id="undoButton" title="Undo (Ctrl/Cmd + Z)" disabled>Undo</button>
          <button id="redoButton" title="Redo (Ctrl/Cmd + Shift + Z)" disabled>Redo</button>
          <span class="divider"></span>
          <button id="clearButton" title="Clear canvas">Clear</button>
          <button id="historyButton" title="Snapshots and timeline">History</button>
          <button id="shareButton" title="Prepare a private share link">Share</button>
          <div class="export-menu">
            <button id="exportButton" aria-expanded="false">Export</button>
            <div id="exportOptions" class="menu" hidden>
              <button data-export="png">PNG image</button>
              <button data-export="jpg">JPG image</button>
              <button data-export="svg">SVG vector</button>
              <button data-export="pdf">PDF document</button>
              <button data-export="json">MindCanvas file</button>
            </div>
          </div>
        </div>
      </header>

      <section class="toolbar" aria-label="Canvas tools">
        <button class="tool active" data-tool="pen" title="Pen (P)"><span class="tool-icon pen-icon"></span><span>Pen</span></button>
        <button class="tool" data-tool="brush" title="Brush (B)"><span class="tool-icon brush-icon"></span><span>Brush</span></button>
        <button class="tool" data-tool="highlighter" title="Highlighter (H)"><span class="tool-icon highlighter-icon"></span><span>Mark</span></button>
        <button class="tool" data-tool="text" title="Text (T)"><span class="tool-icon text-icon">T</span><span>Text</span></button>
        <button class="tool" data-tool="eraser" title="Eraser (E)"><span class="tool-icon eraser-icon"></span><span>Erase</span></button>
        <button class="tool" data-tool="lasso" title="Select (V)"><span class="tool-icon lasso-icon"></span><span>Select</span></button>
        <button class="tool" data-tool="hand" title="Hand (Space)"><span class="tool-icon hand-icon"></span><span>Hand</span></button>
      </section>

      <aside class="inspector" aria-label="Tool settings">
        <label class="setting"><span>Color</span><input id="colorInput" type="color" value="#171717" /></label>
        <label class="setting"><span>Size</span><input id="sizeInput" type="range" min="1" max="36" value="4" /><output id="sizeOutput">4</output></label>
        <button id="accessibilityButton" class="icon-button" title="Accessibility settings" aria-label="Accessibility settings">Aa</button>
      </aside>

      <div class="zoom-control" aria-label="Zoom controls">
        <button id="zoomOut" aria-label="Zoom out">−</button>
        <button id="zoomLabel" title="Reset zoom">100%</button>
        <button id="zoomIn" aria-label="Zoom in">+</button>
      </div>
      <p id="hint" class="hint">Draw freely. Your canvas is saved on this device.</p>
      <div id="textEditor" class="text-editor" contenteditable="true" spellcheck="true" hidden></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <dialog id="exportDialog">
        <form method="dialog" class="dialog-card">
          <header><h2>Export</h2><button class="close-button" value="cancel" aria-label="Close">×</button></header>
          <p>Choose the area and output quality before downloading.</p>
          <fieldset><legend>Area</legend><label><input type="radio" name="exportArea" value="viewport" checked /> Current viewport</label><label><input type="radio" name="exportArea" value="canvas" /> Whole canvas</label><label><input type="radio" name="exportArea" value="selection" /> Current selection</label></fieldset>
          <fieldset><legend>Options</legend><label><input id="highResolution" type="checkbox" /> High resolution (2×)</label><label><input id="transparentBackground" type="checkbox" /> Transparent background</label></fieldset>
          <footer><button value="cancel">Cancel</button><button id="confirmExport" class="primary" value="default">Download</button></footer>
        </form>
      </dialog>
      <dialog id="shareDialog">
        <form method="dialog" class="dialog-card">
          <header><h2>Share privately</h2><button class="close-button" value="cancel" aria-label="Close">×</button></header>
          <p>No data is uploaded automatically. This creates a local share configuration only.</p>
          <fieldset><legend>Permissions</legend><label><input name="permission" type="radio" value="view" checked /> View only</label><label><input name="permission" type="radio" value="edit" /> Editable</label><label><input id="downloadDisabled" type="checkbox" /> Disable download</label></fieldset>
          <label class="modal-field">Password <input id="sharePassword" type="password" autocomplete="new-password" placeholder="Optional" /></label>
          <label class="modal-field">Expires <input id="shareExpiry" type="date" /></label>
          <output id="shareResult" class="share-result" hidden></output>
          <footer><button value="cancel">Close</button><button id="generateShare" class="primary" value="default">Generate link</button></footer>
        </form>
      </dialog>
      <dialog id="historyDialog">
        <form method="dialog" class="dialog-card">
          <header><h2>History</h2><button class="close-button" value="cancel" aria-label="Close">×</button></header>
          <p>Snapshots live only on this device.</p>
          <div id="timeline" class="timeline"></div>
          <footer><button value="cancel">Close</button><button id="snapshotButton" class="primary" value="default">Save snapshot</button></footer>
        </form>
      </dialog>
    </main>
    <script src="app.js"></script>
  </body>
</html>
